name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
        run: |
          test -n "$VITE_TELEGRAM_BOT_TOKEN" || (echo "Missing VITE_TELEGRAM_BOT_TOKEN repository secret" && exit 1)
          test -n "$VITE_TELEGRAM_CHAT_ID" || (echo "Missing VITE_TELEGRAM_CHAT_ID repository secret" && exit 1)
          bun run build
      - name: Copy index.html to 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html
      - name: Keep custom domain on GitHub Pages
        run: cp CNAME dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
